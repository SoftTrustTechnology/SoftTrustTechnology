<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="450" height="120">
  <defs>
    <!-- Gradiente do fundo do ícone -->
    <linearGradient id="iconeGradiente" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C24F1E" />
      <stop offset="100%" stop-color="#D99374" />
    </linearGradient>
  </defs>

  <!-- Grupo do Ícone -->
  <g transform="translate(20, 10)">
    <!-- Rotação para dar o efeito inclinado -->
    <g transform="rotate(-12 50 50)">
      <rect x="15" y="15" width="70" height="70" rx="16" fill="url(#iconeGradiente)" />
      
      <!-- Símbolo ">" -->
      <path d="M 32 35 L 47 50 L 32 65" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            
      <!-- Símbolo "_" -->
      <line x1="51" y1="65" x2="69" y2="65" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Grupo do Texto -->
  <text x="130" y="78" font-family="Montserrat, &#39;Segoe UI&#39;, system-ui, sans-serif" font-size="60" font-weight="800" letter-spacing="-1">
    <!-- Primeira parte branca -->
    <tspan fill="#FFFFFF">Soft</tspan>
    <!-- Segunda parte laranja/ferrugem -->
    <tspan fill="#C24F1E">Trust</tspan>
  </text>
</svg>